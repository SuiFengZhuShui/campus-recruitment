<h2>企业审核流程 — 完整状态机</h2>
<p class="subtitle">从注册到发布招聘的完整路径</p>

<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:24px 0;flex-wrap:wrap;font-size:12px">

<div style="background:#3498db;color:#fff;border-radius:10px;padding:12px 16px;text-align:center">
  <div style="font-size:16px">① 注册</div>
  <div style="color:#ddd;margin-top:4px;font-size:11px">填写企业信息<br>设置密码</div>
</div>
<div style="color:#888;font-size:18px">→</div>
<div style="background:#e74c3c;color:#fff;border-radius:10px;padding:12px 16px;text-align:center">
  <div style="font-size:16px">② 未审核</div>
  <div style="color:#fdd;margin-top:4px;font-size:11px">可登录 · 仅看审核进度<br>上传三件套资质</div>
</div>
<div style="color:#888;font-size:18px">→</div>
<div style="background:#f39c12;color:#fff;border-radius:10px;padding:12px 16px;text-align:center">
  <div style="font-size:16px">③ 审核中</div>
  <div style="color:#fde;margin-top:4px;font-size:11px">学校管理员查看资质<br>逐项审核</div>
</div>
<div style="color:#888;font-size:18px">→</div>
<div style="display:flex;flex-direction:column;gap:8px">
  <div style="background:#2ecc71;color:#fff;border-radius:10px;padding:10px 18px;text-align:center;font-size:13px">
    ✅ 通过 → <b>已审核</b><br>
    <span style="font-size:11px;color:#dfd">完整功能开放</span>
  </div>
  <div style="background:#e74c3c;color:#fff;border-radius:10px;padding:10px 18px;text-align:center;font-size:13px">
    ❌ 拒绝 → <b>退回未审核</b><br>
    <span style="font-size:11px;color:#fdd">逐项标注原因·可重新提交</span>
  </div>
</div>

</div>

<div style="margin-top:24px;background:#1a1a2e;border-radius:12px;padding:20px">
  <div style="font-size:14px;font-weight:600;margin-bottom:12px">🔍 学校审核详情页设计</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;font-size:12px;color:#ccc">
    <div style="background:#0a0a1e;border-radius:8px;padding:14px">
      <b>营业执照</b><br>
      <span style="color:#888">[预览/放大/下载]</span><br>
      <select style="margin-top:6px;background:#333;color:#fff;border:1px solid #555;padding:4px 8px;border-radius:4px">
        <option>待审核</option><option>通过</option><option>不通过</option>
      </select><br>
      <input placeholder="不通过原因（不通过时必填）" style="margin-top:4px;width:100%;background:#333;color:#fff;border:1px solid #555;padding:4px 8px;border-radius:4px;font-size:11px">
    </div>
    <div style="background:#0a0a1e;border-radius:8px;padding:14px">
      <b>经办人身份证</b><br>
      <span style="color:#888">[正反面预览/放大/下载]</span><br>
      <select style="margin-top:6px;background:#333;color:#fff;border:1px solid #555;padding:4px 8px;border-radius:4px">
        <option>待审核</option><option>通过</option><option>不通过</option>
      </select><br>
      <input placeholder="不通过原因" style="margin-top:4px;width:100%;background:#333;color:#fff;border:1px solid #555;padding:4px 8px;border-radius:4px;font-size:11px">
    </div>
    <div style="background:#0a0a1e;border-radius:8px;padding:14px">
      <b>招聘授权委托书</b><br>
      <span style="color:#888">[预览/放大/下载]</span><br>
      <select style="margin-top:6px;background:#333;color:#fff;border:1px solid #555;padding:4px 8px;border-radius:4px">
        <option>待审核</option><option>通过</option><option>不通过</option>
      </select><br>
      <input placeholder="不通过原因" style="margin-top:4px;width:100%;background:#333;color:#fff;border:1px solid #555;padding:4px 8px;border-radius:4px;font-size:11px">
    </div>
  </div>
  <div style="margin-top:14px;display:flex;justify-content:center;gap:16px">
    <button class="mock-button" style="background:#2ecc71">✅ 全部通过</button>
    <button class="mock-button" style="background:#e74c3c">❌ 驳回（有任意一项不通过即整体驳回）</button>
  </div>
  <div style="margin-top:10px;text-align:center;font-size:11px;color:#888">
    审核逻辑：三项全部通过 → 企业状态变 approved | 任一项不通过 → 企业状态变 rejected，返回未审核
  </div>
</div>
