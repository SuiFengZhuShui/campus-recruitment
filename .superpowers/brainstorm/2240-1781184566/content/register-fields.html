<h2>注册字段设计</h2>
<p class="subtitle">企业注册 + 学生注册</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px">

<div style="background:#1a1a2e;border-radius:14px;padding:24px">
  <div style="font-size:20px;margin-bottom:16px">🏢 企业注册</div>

  <div style="font-size:13px;color:#aaa;margin-bottom:12px">基本信息</div>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
    <div style="display:flex;justify-content:space-between"><span>企业名称</span><span style="color:#e94560">必填</span></div>
    <div style="display:flex;justify-content:space-between"><span>统一社会信用代码</span><span style="color:#e94560">必填</span></div>
    <div style="display:flex;justify-content:space-between"><span>所属行业</span><span style="color:#e94560">必填 · 下拉</span></div>
    <div style="display:flex;justify-content:space-between"><span>企业规模</span><span style="color:#888">选填 · 下拉</span></div>
    <div style="display:flex;justify-content:space-between"><span>企业简介</span><span style="color:#888">选填 · 文本</span></div>
    <div style="display:flex;justify-content:space-between"><span>归属学院</span><span style="color:#e94560">必填 · 下拉</span></div>
  </div>

  <hr style="border-color:#333;margin:16px 0">

  <div style="font-size:13px;color:#aaa;margin-bottom:12px">联系人信息</div>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
    <div style="display:flex;justify-content:space-between"><span>联系人姓名</span><span style="color:#e94560">必填</span></div>
    <div style="display:flex;justify-content:space-between"><span>联系人手机号</span><span style="color:#e94560">必填 · 验证码</span></div>
    <div style="display:flex;justify-content:space-between"><span>企业邮箱</span><span style="color:#e94560">必填</span></div>
  </div>

  <hr style="border-color:#333;margin:16px 0">

  <div style="font-size:13px;color:#aaa;margin-bottom:12px">账户信息</div>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
    <div style="display:flex;justify-content:space-between"><span>登录密码</span><span style="color:#e94560">必填</span></div>
    <div style="display:flex;justify-content:space-between"><span>图形验证码</span><span style="color:#e94560">必填</span></div>
  </div>

  <div style="margin-top:12px;font-size:12px;color:#f39c12">
    ⚠️ 注册后即可登录，但仅显示审核进度<br>
    三项资质上传后才可提交审核
  </div>
</div>

<div style="background:#1a1a2e;border-radius:14px;padding:24px">
  <div style="font-size:20px;margin-bottom:16px">🎓 学生注册</div>

  <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
    <div style="display:flex;justify-content:space-between"><span>姓名</span><span style="color:#e94560">必填</span></div>
    <div style="display:flex;justify-content:space-between"><span>学号</span><span style="color:#e94560">必填 · 自动匹配学院</span></div>
    <div style="display:flex;justify-content:space-between"><span>班级</span><span style="color:#e94560">必填</span></div>
    <div style="display:flex;justify-content:space-between"><span>手机号</span><span style="color:#e94560">必填 · 验证码</span></div>
    <div style="display:flex;justify-content:space-between"><span>登录密码</span><span style="color:#e94560">必填</span></div>
    <div style="display:flex;justify-content:space-between"><span>图形验证码</span><span style="color:#e94560">必填</span></div>
  </div>

  <div style="margin-top:16px;background:#2ecc7122;border-radius:8px;padding:12px;font-size:12px;color:#2ecc71;line-height:1.8">
    🔮 学号→学院自动匹配<br>
    学校后台预设学号规则（如前4位=学院代码）<br>
    学生注册时输入学号，自动归属学院
  </div>
</div>

</div>
